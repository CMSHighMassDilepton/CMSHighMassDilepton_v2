      {"6839c163-a6d9-4965-8fe0-cd444267242d":{"version":"3.5.2","title":"Bokeh Application","roots":[{"type":"object","name":"Tabs","id":"p10652","attributes":{"sizing_mode":"stretch_both","tabs":[{"type":"object","name":"TabPanel","id":"p10643","attributes":{"title":"Summary","child":{"type":"object","name":"Div","id":"p10642","attributes":{"styles":{"type":"map","entries":[["width","100%"],["height","100%"],["max-width","1920px"],["max-height","1080px"],["padding","12px"],["border","1px solid lightgray"],["box-shadow","inset 1px 0 8px 0 lightgray"],["overflow","auto"]]},"text":"\n        &lt;h1&gt; Dask Performance Report &lt;/h1&gt;\n\n        &lt;i&gt; Select different tabs on the top for additional information &lt;/i&gt;\n\n        &lt;h2&gt; Duration: 96.99 s &lt;/h2&gt;\n        &lt;h2&gt; Tasks Information &lt;/h2&gt;\n        &lt;ul&gt;\n         &lt;li&gt; number of tasks: 122 &lt;/li&gt;\n         \n&lt;li&gt; compute time: 10m 48s &lt;/li&gt;\n&lt;li&gt; transfer time: 11.12 s &lt;/li&gt;\n        &lt;/ul&gt;\n\n        &lt;h2&gt; Scheduler Information &lt;/h2&gt;\n        &lt;ul&gt;\n          &lt;li&gt; Address: tls://10.5.12.110:8786 &lt;/li&gt;\n          &lt;li&gt; Workers: 5 &lt;/li&gt;\n          &lt;li&gt; Threads: 10 &lt;/li&gt;\n          &lt;li&gt; Memory: 50.00 GiB &lt;/li&gt;\n          &lt;li&gt; Dask Version: 2024.9.1 &lt;/li&gt;\n          &lt;li&gt; Dask.Distributed Version: 2024.9.1 &lt;/li&gt;\n        &lt;/ul&gt;\n\n        &lt;h2&gt; Calling Code &lt;/h2&gt;\n        &lt;pre&gt;\nfrom coffea.nanoevents import NanoEventsFactory, NanoAODSchema\n#from src.dielectron_processor import EventProcessor\nfrom src.copperhead_processor import EventProcessor\nimport awkward as ak\nimport matplotlib.pyplot as plt\nimport numpy as np\nimport dask\n# from dask.distributed import Client\nimport sys\nsys.path.append(\"/depot/cms/users/kaur214/analysis_facility/CMSHighMassDilepton_v2/CMSHighMassDilepton_v2\")\nimport time\nimport json\nfrom distributed import LocalCluster, Client, progress\nimport pandas as pd\nimport os\nimport tqdm\nimport warnings\nimport dask_awkward as dak\nimport glob\nfrom itertools import islice\nimport copy\nimport argparse\nfrom dask.distributed import performance_report\nimport os\nfrom omegaconf import OmegaConf\nfrom coffea.nanoevents.methods import vector\n\nfrom dask.delayed import delayed\n\n# dask.config.set({'logging.distributed': 'error'})\nimport logging\nlogger = logging.getLogger(\"distributed.utils_perf\")\nlogger.setLevel(logging.ERROR)\nimport warnings\nwarnings.filterwarnings(\"ignore\", category=RuntimeWarning) \n\ntest_mode = False\nnp.set_printoptions(threshold=sys.maxsize)\nimport gc\nimport ctypes\nfrom src.lib.get_parameters import getParametersForYr\n\ndef trim_memory() -&gt; int:\n     libc = ctypes.CDLL(\"libc.so.6\")\n     return libc.malloc_trim(0)\n    \n# # test code limiting memory leak -----------------------------------\n# import gc\n# client.run(gc.collect)  # collect garbage on all workers\n# import ctypes\n# def trim_memory() -&gt; int:\n#      libc = ctypes.CDLL(\"libc.so.6\")\n#      return libc.malloc_trim(0)\n# client.run(trim_memory)\n\n# #-------------------------------------------------------------------\n\ndef getSavePath(start_path: str, dataset_dict: dict, file_idx: int):\n    \"\"\"\n    Small wrapper function that returns the directory path to save the parquets\n    from stage1\n    \"\"\"\n    fraction = round(dataset_dict[\"metadata\"][\"fraction\"], 3)\n    fraction_str = str(fraction).replace('.', '_')\n    sample_name = dataset_dict['metadata']['dataset']\n    save_path = start_path + f\"/f{fraction_str}/{dataset_dict['metadata']['dataset']}/{file_idx}\"\n    return save_path\n\ndef dataset_loop(processor, dataset_dict, file_idx=0, test=False, save_path=None):\n\n    if save_path is None:\n        #save_path = \"/depot/cms/users/kaur214/analysis_facility/outputs/test/elec/\" # default\n        #save_path = \"/depot/cms/users/kaur214/analysis_facility/outputs/test/muon/\" # default\n        save_path = \"/depot/cms/users/kaur214/analysis_facility/outputs/test/muon/rocc_cor/\" # default\n    # print(f\"dataset_dict: {dataset_dict['files']}\")\n    events = NanoEventsFactory.from_root(\n        dataset_dict[\"files\"],\n        schemaclass=NanoAODSchema,\n        metadata= dataset_dict[\"metadata\"],\n        uproot_options={\n            \"timeout\":2400,\n            # \"allow_read_errors_with_report\": True, # this makes process skip over OSErrors\n        },\n    ).events()\n\n    \n    out_collections = processor.process(events)\n    dataset_fraction = dataset_dict[\"metadata\"][\"fraction\"]\n\n\n    skim_dict = out_collections\n    skim_dict[\"fraction\"] = dataset_fraction*(ak.ones_like(out_collections[\"event\"]))\n\n    skim_zip = ak.zip(skim_dict, depth_limit=1)\n\n    df = ak.to_dataframe(skim_zip)\n    df.to_parquet(save_path)\n\ndef divide_chunks(data: dict, SIZE: int):\n   it = iter(data)\n   for i in range(0, len(data), SIZE):\n      yield {k:data[k] for k in islice(it, SIZE)}\n\n\nif __name__ == \"__main__\":\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\n    \"-save\",\n    \"--save_path\",\n    dest=\"save_path\",\n    default=\"/depot/cms/users/kaur214/analysis_facility/outputs/test/muon/rocc_cor/\",\n    #default=\"/depot/cms/users/kaur214/analysis_facility/outputs/test/elec/\",\n    action=\"store\",\n    help=\"save path to store stage1 output files\",\n    )\n    parser.add_argument(\n    \"-y\",\n    \"--year\",\n    dest=\"year\",\n    default=\"2018\",\n    action=\"store\",\n    help=\"string value of year we are calculating\",\n    )\n    parser.add_argument(\n    \"--use_gateway\",\n    dest=\"use_gateway\",\n    default=False, \n    action=argparse.BooleanOptionalAction,\n    help=\"If true, uses dask gateway client instead of local\",\n    )\n    parser.add_argument(\n    \"-aod_v\",\n    \"--NanoAODv\",\n    dest=\"NanoAODv\",\n    default=\"9\",\n    action=\"store\",\n    help=\"version number of NanoAOD samples we're working with. currently, only 9 and 12 are supported\",\n    )\n\n    parser.add_argument(\n    \"-fl\",\n    \"--flavor\",\n    dest=\"channel\",\n    default=\"mumu\",\n    action=\"store\",\n    help=\"specify which channel to run on.\",\n    )\n\n    args = parser.parse_args()\n    # make NanoAODv into an interger variable\n    print(f\"args.NanoAODv: {args.NanoAODv}\")\n    print(f\"args.year: {args.year}\")\n    args.NanoAODv = int(args.NanoAODv)\n    # check for NanoAOD versions\n    allowed_nanoAODvs = [9, 12]\n    if not (args.NanoAODv in allowed_nanoAODvs):\n        print(\"wrong NanoAOD version is given!\")\n        raise ValueError\n    time_step = time.time()\n    \n    warnings.filterwarnings('ignore')\n    \"\"\"\n    Coffea Dask automatically uses the Dask Client that has been defined above\n    \"\"\"\n    \n\n    config = getParametersForYr(\"./configs/parameters/\" , args.year)\n    # print(f\"stage1 config: {config}\")\n    coffea_processor = EventProcessor(config, test_mode=test_mode)\n\n    if not test_mode: # full scale implementation\n        # # original ---------------------------------------------------------\n        if args.use_gateway:\n            from dask_gateway import Gateway\n            gateway = Gateway(\n                \"http://dask-gateway-k8s.geddes.rcac.purdue.edu/\",\n                proxy_address=\"traefik-dask-gateway-k8s.cms.geddes.rcac.purdue.edu:8786\",\n            )\n            cluster_info = gateway.list_clusters()[0]# get the first cluster by default. There only should be one anyways\n            client = gateway.connect(cluster_info.name).get_client()\n            print(f\"client: {client}\")\n            print(\"Gateway Client created\")\n        # # #-----------------------------------------------------------\n        else:\n            # client = Client(n_workers=1,  threads_per_worker=1, processes=True, memory_limit='15 GiB') \n            # client = Client(n_workers=15,  threads_per_worker=1, processes=True, memory_limit='6 GiB') \n            client = Client(n_workers=12,  threads_per_worker=1, processes=True, memory_limit='10 GiB') \n            print(\"Local scale Client created\")\n        #-------------------------------------------------------------------------------------\n        #-----------------------------------------------------------\n        # client = Client(n_workers=8,  threads_per_worker=1, processes=True, memory_limit='8 GiB') \n        #---------------------------------------------------------\n        # print(\"cluster scale up\")\n        # sample_path = \"./prestage_output/processor_samples.json\"\n        sample_path = \"/depot/cms/users/kaur214/analysis_facility/outputs/test/prestage_output/processor_samples.json\"\n        with open(sample_path) as file:\n            samples = json.loads(file.read())\n        # add in NanoAODv info into samples metadata for coffea processor\n        for dataset in samples.keys():\n            samples[dataset][\"metadata\"][\"NanoAODv\"] = args.NanoAODv\n        start_save_path = args.save_path + f\"/stage1_output/{args.year}\"\n        print(f\"start_save_path: {start_save_path}\")\n        # with performance_report(filename=\"dask-report.html\"):\n        with performance_report(filename=\"dask-report.html\"):\n            for dataset, sample in tqdm.tqdm(samples.items()):\n            # for dataset, sample in samples.items():\n                sample_step = time.time()\n                max_file_len = 130 ##number of files per job\n                #max_file_len = 130 ##number of files per job\n                smaller_files = list(divide_chunks(sample[\"files\"], max_file_len))\n                print(f\"max_file_len: {max_file_len}\")\n                print(f\"len(smaller_files): {len(smaller_files)}\")\n                # for idx in range(len(smaller_files)):\n                # for idx in tqdm.tqdm(range(2, len(smaller_files)), leave=False):\n                tasks = []  # Store all tasks for parallel execution\n\n                for idx in tqdm.tqdm(range(len(smaller_files)), leave=False):\n                    # print(\"restarting workers!\")\n                    # client.restart(wait_for_workers = False)\n                    smaller_sample = copy.deepcopy(sample)\n                    smaller_sample[\"files\"] = smaller_files[idx]\n                    var_step = time.time()\n                    # print(f\"var_step: {var_step}\")\n                    save_path = getSavePath(start_save_path, smaller_sample, idx)\n                    \n                    if not os.path.exists(save_path):\n                        os.makedirs(save_path)\n                    dataset_loop(coffea_processor, smaller_sample, file_idx=idx, test=test_mode, save_path=save_path)\n                    \n                sample_elapsed = round(time.time() - sample_step, 3)\n                print(f\"Finished sample {dataset} in {sample_elapsed} s.\")\n                \n    else:\n        # dataset_loop(coffea_processor, xrootd_path+fname, test=test_mode)\n\n        sample_path = \"/depot/cms/users/kaur214/analysis_facility/outputs/test/prestage_output/fraction_processor_samples.json\"\n        with open(sample_path) as file:\n            samples = json.loads(file.read())\n        # print(f\"samples.keys(): {samples.keys()}\")\n\n        with performance_report(filename=\"dask-report.html\"):\n            # for dataset, sample in samples.items():\n            for dataset, sample in tqdm.tqdm(samples.items()):\n                \n                # testing\n                # if (\"dy_M-100To200\" not in dataset) and (\"data_A\" not in dataset):\n                # if (\"dy_M-100To200\" not in dataset) :\n                # if (\"ggh_powheg\" not in dataset) and (\"vbf_powheg\" not in dataset):\n                #     continue\n                # print(f\"dataset: {dataset}\")\n                dataset_loop(coffea_processor, sample, test=test_mode)\n        \n    \n\n    \n\n    \n    elapsed = round(time.time() - time_step, 3)\n    print(f\"Finished everything in {elapsed} s.\")\n\n        &lt;/pre&gt;\n        "}}}},{"type":"object","name":"TabPanel","id":"p10647","attributes":{"title":"Task Stream","child":{"type":"object","name":"Figure","id":"p10289","attributes":{"name":"task_stream","sizing_mode":"stretch_both","x_range":{"type":"object","name":"DataRange1d","id":"p10287","attributes":{"range_padding":0}},"y_range":{"type":"object","name":"DataRange1d","id":"p10288","attributes":{"range_padding":0}},"x_scale":{"type":"object","name":"LinearScale","id":"p10299"},"y_scale":{"type":"object","name":"LinearScale","id":"p10300"},"title":{"type":"object","name":"Title","id":"p10292","attributes":{"text":"Task Stream"}},"renderers":[{"type":"object","name":"GlyphRenderer","id":"p10329","attributes":{"data_source":{"type":"object","name":"ColumnDataSource","id":"p10284","attributes":{"selected":{"type":"object","name":"Selection","id":"p10285","attributes":{"indices":[],"line_indices":[]}},"selection_policy":{"type":"object","name":"UnionRenderers","id":"p10286"},"data":{"type":"map","entries":[["start",[1740779733419.9673,1740779733420.0898,1740779733421.1355,1740779733757.454,1740779733757.6663,1740779730991.0112,1740779733940.7776,1740779733940.9785,1740779731176.3645,1740779734216.739,1740779734216.9797,1740779731340.3677,1740779735379.6826,1740779735380.2087,1740779732507.0906,1740779735408.2205,1740779736928.7463,1740779737889.9646,1740779734374.4397,1740779734385.449,1740779734389.1267,1740779735425.8958,1740779739341.2126,1740779740181.4626,1740779744721.8499,1740779743373.9426,1740779745545.712,1740779741355.1382,1740779746233.4014,1740779741402.616,1740779746333.0798,1740779741902.9163,1740779748738.583,1740779733545.663,1740779733546.0881,1740779733557.6658,1740779733561.9048,1740779743884.0972,1740779750549.4365,1740779745096.0874,1740779753812.3975,1740779754081.2048,1740779745641.0955,17
